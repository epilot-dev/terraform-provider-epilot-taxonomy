overlay: 1.0.0
info:
  title: Speakeasy overlay for epilot product API
  version: 0.0.1
actions:
  - target: $
    update:
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 5000 # 5 seconds
          maxInterval: 60000 # 60 seconds
          maxElapsedTime: 3600000 # 5 minutes
          exponent: 1.5
        statusCodes:
          - 5XX
        retryConnectionErrors: true
      servers:
      - url: https://entity.sls.epilot.io
  
  # TaxonomyClassifications
  - target: $["paths"]["/v2/entity/taxonomies/classifications/{classificationSlug}"]["get"]
    update:
      x-speakeasy-entity-operation: TaxonomyClassification#get
  - target: $["paths"]["/v2/entity/taxonomies/classifications"]["post"]
    update:
      x-speakeasy-entity-operation: TaxonomyClassification#create
  - target: $["paths"]["/v2/entity/taxonomies/classifications/{classificationSlug}"]["put"]
    update:
      x-speakeasy-entity-operation: TaxonomyClassification#update
  - target: $["paths"]["/v2/entity/taxonomies/classifications/{classificationSlug}"]["delete"]
    update:
      x-speakeasy-entity-operation: TaxonomyClassification#delete
  - target: $["components"]["parameters"]["TaxonomyClassificationSlugPathParam"]
    update:
      x-speakeasy-match: id
  - target: $["components"]["schemas"]["TaxonomyClassification"]
    update:
      x-speakeasy-entity: TaxonomyClassification
  - target: $["components"]["schemas"]["TaxonomyClassification"]
    update:
      x-speakeasy-entity: TaxonomyClassification

  # Taxonomy - family
  - target: $["paths"]["/v1/entity/taxonomies/{taxonomySlug}"]["get"]
    update:
      x-speakeasy-entity-operation: Taxonomy#get
  - target: $["paths"]["/v1/entity/taxonomies"]["post"]
    update:
      x-speakeasy-entity-operation: Taxonomy#create
  - target: $["paths"]["/v1/entity/taxonomies/{taxonomySlug}"]["put"]
    update:
      x-speakeasy-entity-operation: Taxonomy#update
  - target: $["paths"]["/v1/entity/taxonomies/{taxonomySlug}"]["delete"]
    update:
      x-speakeasy-entity-operation: Taxonomy#delete
  - target: $["components"]["parameters"]["TaxonomySlugPathParam"]
    update:
      x-speakeasy-match: slug
  - target: $["components"]["schemas"]["Taxonomy"]
    update:
      x-speakeasy-entity: Taxonomy

  # Simplify enabled_locations to a plain string array (instead of anyOf union type)
  - target: $["components"]["schemas"]["Taxonomy"]["properties"]["enabled_locations"]["items"]
    remove: true
  - target: $["components"]["schemas"]["TaxonomyClassification"]["properties"]["enabled_locations"]["items"]
    remove: true


  # Simplify enabled_locations to a plain string array (instead of anyOf union type)
  - target: $["components"]["schemas"]["Taxonomy"]["properties"]["enabled_locations"]
    update:
      items:
        type: string
  - target: $["components"]["schemas"]["TaxonomyClassification"]["properties"]["enabled_locations"]
    update:
      items:
        type: string
